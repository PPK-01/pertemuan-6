<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" fill="none">
  <defs>
    <style>
      @keyframes markPulse {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.05); }
      }
      .bg-mark { fill: #00144A; rx: 28px; stroke: #233B6E; stroke-width: 2; }
      .accent-line { stroke: #FFC400; stroke-width: 4; stroke-linecap: round; }
      .letter-r { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 900; font-size: 54px; fill: #FFFFFF; }
      .dot-accent { fill: #FFC400; transform-origin: 94px 34px; animation: markPulse 2s infinite ease-in-out; }
      @media (prefers-reduced-motion: reduce) {
        .dot-accent { animation: none !important; }
      }
    </style>
  </defs>
  <rect x="2" y="2" width="124" height="124" class="bg-mark" />
  <!-- Yellow identity strip -->
  <line x1="20" y1="24" x2="48" y2="24" class="accent-line" />
  <!-- R glyph -->
  <text x="32" y="86" class="letter-r">R</text>
  <!-- Accent dot -->
  <circle cx="94" cy="34" r="6" class="dot-accent" />
  <!-- 4 mini code dots -->
  <circle cx="48" cy="102" r="3.5" fill="#3D5688" />
  <circle cx="62" cy="102" r="3.5" fill="#3D5688" />
  <circle cx="76" cy="102" r="3.5" fill="#FFC400" />
  <circle cx="90" cy="102" r="3.5" fill="#3D5688" />
</svg>

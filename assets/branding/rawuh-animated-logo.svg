<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 260" width="100%" height="260" fill="none">
  <defs>
    <style>
      .bg-card { fill: #00144A; stroke: #233B6E; stroke-width: 1.5; rx: 16px; }
      .header-strip { fill: #001C66; rx: 14px; }
      .header-accent { fill: #FFC400; }
      .brand-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; font-size: 42px; fill: #FFFFFF; letter-spacing: -0.5px; }
      .brand-sub { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 500; font-size: 14px; fill: #8A9BB8; letter-spacing: 0.2px; }
      .pill-badge { fill: #0B255E; stroke: #2E4B82; stroke-width: 1; rx: 20px; }
      .badge-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 600; font-size: 11px; fill: #FFC400; letter-spacing: 1.2px; text-transform: uppercase; }
      .cell-box { fill: #00123D; stroke: #314B7D; stroke-width: 1.5; rx: 10px; }
      .cell-box-accent { stroke: #FFC400; stroke-width: 2; fill: #091C4B; }
      .cell-num { font-family: 'SF Mono', Monaco, Menlo, Consolas, monospace; font-weight: 700; font-size: 28px; fill: #FFFFFF; text-anchor: middle; dominant-baseline: central; }
      .cell-num-accent { fill: #FFC400; }
      .token-group { transform-origin: 640px 145px; }
    </style>
    <clipPath id="card-clip">
      <rect x="10" y="10" width="820" height="240" rx="16" />
    </clipPath>
  </defs>

  <!-- Canvas Background Card -->
  <g clip-path="url(#card-clip)">
    <rect x="10" y="10" width="820" height="240" class="bg-card" />
    <!-- Subtle Grid Lines -->
    <line x1="10" y1="68" x2="830" y2="68" stroke="#142C61" stroke-width="1" />
    <line x1="490" y1="68" x2="490" y2="250" stroke="#142C61" stroke-width="1" stroke-dasharray="4 4" />
    
    <!-- Top Header Bar (Identity Card Stripe) -->
    <rect x="18" y="18" width="804" height="42" class="header-strip" />
    <rect x="18" y="18" width="6" height="42" class="header-accent" />
    <text x="36" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="12px" fill="#D3DEEE" letter-spacing="1.5px">KARTU PRESENSI PRAKTIKUM DIGITAL</text>

    <!-- Left Brand Section -->
    <g transform="translate(36, 102)">
      <!-- Role Badge -->
      <rect x="0" y="0" width="156" height="24" class="pill-badge" />
      <text x="12" y="16" class="badge-text">Expo SDK 57 • OFFLINE</text>
      
      <!-- Brand Name -->
      <text x="0" y="60" class="brand-title">RAWUH</text>
      
      <!-- Accent Tag (Sejajar di sebelah kanan dan sejajar bagian bawah tulisan RAWUH) -->
      <rect x="174" y="38" width="54" height="22" rx="4" fill="#FFC400" />
      <text x="182" y="53" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="11px" fill="#00144A" letter-spacing="0.8px">V1.0</text>
      
      <!-- Subtitle Description -->
      <text x="0" y="88" class="brand-sub">Sistem presensi praktikum presisi dengan validasi token 4-digit</text>
      <text x="0" y="108" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="400" font-size="12px" fill="#5E759B">Offline-first • Zero-shadow Card UI • Aksesibilitas WCAG AA (4.5:1)</text>
    </g>

    <!-- Right Interactive Token Code Cells (Static, no pulse) -->
    <g class="token-group">
      <!-- Section Tag -->
      <text x="518" y="105" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="11px" fill="#8A9BB8" letter-spacing="1px">TOKEN AKTIF</text>
      <text x="758" y="105" font-family="'SF Mono', Menlo, monospace" font-weight="600" font-size="10.5px" fill="#FFC400" text-anchor="end">4-DIGIT</text>

      <!-- Cell 1 -->
      <rect x="518" y="118" width="54" height="64" class="cell-box" />
      <text x="545" y="150" class="cell-num">8</text>

      <!-- Cell 2 -->
      <rect x="584" y="118" width="54" height="64" class="cell-box" />
      <text x="611" y="150" class="cell-num">4</text>

      <!-- Cell 3 -->
      <rect x="650" y="118" width="54" height="64" class="cell-box-accent" />
      <text x="677" y="150" class="cell-num cell-num-accent">2</text>

      <!-- Cell 4 -->
      <rect x="716" y="118" width="54" height="64" class="cell-box" />
      <text x="743" y="150" class="cell-num">9</text>

      <!-- Sub label below token cells -->
      <text x="643" y="206" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="11.5px" fill="#8A9BB8" text-anchor="middle">Satu ketukan untuk salin &amp; verifikasi</text>
    </g>
  </g>
</svg>
